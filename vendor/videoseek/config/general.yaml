# LiteLLM routes by provider prefix; "gemini/" selects the Google AI Studio API.
model_name: "gemini/gemini-3.8-flash"
# These are the *names* of environment variables, resolved via os.getenv in config/__init__.py.
api_base: "GEMINI_API_BASE"
api_key: "GEMINI_API_KEY"
api_version: "GEMINI_API_VERSION"

reasoning_effort: "medium"
seed: 42
temperature: 1.0
max_steps: 20
max_retries: 8
max_tokens: 32768
# A runaway guard, not a budget: a run stops before its next call once LiteLLM's
# cost estimate reaches this. The pilot's priciest ordering run cost $0.17.
max_run_cost_usd: 1.0

frame_sampling_factor: 4
overview_base: 16
skim_base: 4
focus_base: 4

tools: ["overview", "skim", "focus"]